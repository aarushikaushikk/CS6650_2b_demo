# Target host comes from TARGET_HOST, e.g.
#   export TARGET_HOST=http://$ECS_IP:8080
#   docker compose up --scale worker=4
services:
  master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master -H ${TARGET_HOST:?Set TARGET_HOST, e.g. http://<ECS_IP>:8080}

  worker:
    image: locustio/locust
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master