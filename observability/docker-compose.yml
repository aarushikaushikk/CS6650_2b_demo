# HW6 Part III: Prometheus + Grafana run locally and scrape EVERY ECS task.
# Task IPs come from scripts/update-prom-targets.sh, which writes
# ~/cs6650-prom/targets.json (file-based service discovery).
#
#   Terminal 1 (repo root):  ./scripts/update-prom-targets.sh
#   Terminal 2:              cd observability && docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v3.4.0
    ports:
      - "9090:9090"
    volumes:
      - ${HOME}/cs6650-prom:/etc/prometheus/sd:ro
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana   # keeps your HW5 dashboard + data source
    depends_on:
      - prometheus

configs:
  prom_config:
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: "product-api"
          metrics_path: /metrics
          file_sd_configs:
            - files: ["/etc/prometheus/sd/targets.json"]
              refresh_interval: 15s

volumes:
  grafana-data:
