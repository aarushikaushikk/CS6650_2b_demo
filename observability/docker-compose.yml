# HW6 Option B: Prometheus + Grafana run locally, but scrape the app
# running on ECS (no local app container). Set ECS_IP before starting:
#   export ECS_IP=$(../scripts/get-ecs-ip.sh)
#   docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v3.4.0
    ports:
      - "9090:9090"
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana   # keeps your HW5 dashboard + data source
    depends_on:
      - prometheus

configs:
  prom_config:
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: "product-api"
          metrics_path: /metrics
          static_configs:
            - targets: ["${ECS_IP:?Set ECS_IP to the ECS task public IP}:8080"]

volumes:
  grafana-data: