services:
  app:
    build: ../src
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.4.0
    ports:
      - "9090:9090"
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

configs:
  prom_config:
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: "product-api"
          metrics_path: /metrics
          static_configs:
            - targets: ["app:8080"]

volumes:
  grafana-data: